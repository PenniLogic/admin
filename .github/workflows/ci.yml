{
  "name": "CI",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "branches": [
        "main"
      ]
    },
    "pull_request": {
      "branches": [
        "main"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "ci": {
      "name": "CI",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "env": {
        "NEXT_TELEMETRY_DISABLED": "1"
      },
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Python",
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "3.14"
          }
        },
        {
          "name": "Node",
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version-file": ".nvmrc"
          }
        },
        {
          "name": "Run checks",
          "run": "python scripts/check_repository.py\nnpm ci --no-audit --no-fund\nnpm run lint\nnpm run typecheck\nnpm run check:imports\nnpm test\nnpm run build\nnpm run smoke"
        }
      ]
    }
  }
}
